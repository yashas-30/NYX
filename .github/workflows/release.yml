name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.5.0)'
        required: true
        default: 'v0.5.0'

env:
  NODE_OPTIONS: '--max-old-space-size=4096'
  CI: 'true'
  HUSKY: '0'

defaults:
  run:
    shell: bash

jobs:
  build-and-release:
    permissions:
      contents: write
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install Dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @nyx/shared build

      - name: Build Tauri Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name || inputs.tag }}
          releaseName: 'NYX ${{ github.ref_name || inputs.tag }} — Native AI Studio'
          releaseBody: |
            ## 🌌 NYX ${{ github.ref_name || inputs.tag }}

            High-Performance Native Local Intelligence & Multi-Provider AI Studio.

            ### 🚀 Highlights
            - 🖥️ **Built-in Local GPU Runner**: Vulkan `llama.cpp` acceleration for GGUF models.
            - 🌐 **40 Curated Cloud Models**: Google Gemini, Groq LPUs, Mistral AI, NVIDIA NIM, and OpenRouter Free Tier.
            - 📊 **Slidev & PowerPoint Studio**: Interactive presentations with one-click `.pptx` and `.pdf` export.
            - 📐 **39 Visual Architecture Diagrams**: Publication-grade inline SVG diagrams.
            - 🔍 **Real-Time Grounded Web Search**: DuckDuckGo search integration with verified citations and video embeds.
            - 🤖 **ReAct Agent Conductor**: Rust-native multi-step autonomous tool execution.

            ### 📦 Download Instructions
            - Download `NYX_${{ github.ref_name || inputs.tag }}_x64-setup.exe` below and run the installer to set up NYX on Windows.
          releaseDraft: false
          prerelease: false
